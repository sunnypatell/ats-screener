name: codeql

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # weekly, so newly published queries still run against code nobody touched
    - cron: '21 6 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # required to upload the sarif results to the security tab
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          # covers the server routes and scoring engine. the js extractor skips .svelte templates
          languages: javascript-typescript
          # extended adds the injection and request-forgery queries the api routes need
          queries: security-extended

      # no build step: the javascript-typescript extractor reads source directly
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
